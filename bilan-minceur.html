<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilan Minceur — Gestion Clients</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --rose: #C2496A; --rose-light: #fdf0f3; --rose-mid: #f0c0cc;
  --rose-dark: #8a2f48; --rose-pale: #fdf7f8;
  --text: #2a1f23; --text-muted: #8a7a7e; --border: #e8dde0;
  --bg: #faf6f7; --white: #ffffff; --radius: 10px; --radius-lg: 14px;
}
*, *::before, *::after { box-sizing: border-box; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; }

/* ── LAYOUT ── */
.app { display: flex; height: 100dvh; position: relative; }

/* ── SIDEBAR ── */
.sidebar {
  width: 270px; min-width: 270px; background: var(--white);
  border-right: 1px solid var(--border); display: flex; flex-direction: column;
  height: 100dvh; transition: transform 0.25s ease; z-index: 50;
}
.sidebar-logo { padding: 1.25rem 1rem 0.9rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.sidebar-logo h1 { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 500; color: var(--rose); }
.sidebar-logo p { font-size: 10px; color: var(--text-muted); letter-spacing: 0.05em; text-transform: uppercase; margin-top: 1px; }
.sidebar-close { display: none; background: none; border: none; cursor: pointer; font-size: 20px; color: var(--text-muted); padding: 4px; }
.search-wrap { padding: 0.65rem 0.9rem; border-bottom: 1px solid var(--border); }
.search-wrap input { width: 100%; padding: 8px 11px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; background: var(--rose-pale); color: var(--text); font-family: 'DM Sans', sans-serif; outline: none; }
.search-wrap input:focus { border-color: var(--rose-mid); }
.search-wrap input::placeholder { color: var(--text-muted); }
.client-list { flex: 1; overflow-y: auto; padding: 0.4rem 0; }
.client-list::-webkit-scrollbar { width: 3px; }
.client-list::-webkit-scrollbar-thumb { background: var(--rose-mid); border-radius: 2px; }
.client-item { padding: 0.6rem 1rem; cursor: pointer; display: flex; align-items: center; gap: 9px; border-left: 3px solid transparent; }
.client-item:hover { background: var(--rose-pale); }
.client-item.active { background: var(--rose-light); border-left-color: var(--rose); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--rose-mid); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: var(--rose-dark); flex-shrink: 0; }
.client-item.active .avatar { background: var(--rose); color: white; }
.client-name { font-size: 13px; font-weight: 500; line-height: 1.3; }
.client-sub { font-size: 11px; color: var(--text-muted); }
.new-btn { margin: 0.65rem 0.9rem; padding: 9px; border: 1.5px dashed var(--rose-mid); border-radius: var(--radius); background: transparent; color: var(--rose); font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.new-btn:hover { background: var(--rose-light); }

/* ── MAIN ── */
.main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; min-width: 0; }
.main::-webkit-scrollbar { width: 4px; }
.main::-webkit-scrollbar-thumb { background: var(--rose-mid); border-radius: 2px; }

/* ── MOBILE TOPBAR ── */
.mobile-topbar { display: none; padding: 0.75rem 1rem; background: var(--white); border-bottom: 1px solid var(--border); align-items: center; gap: 10px; }
.hamburger { background: none; border: none; cursor: pointer; font-size: 22px; color: var(--rose); padding: 2px 4px; }
.mobile-topbar h1 { font-family: 'Cormorant Garamond', serif; font-size: 18px; color: var(--rose); }

/* ── OVERLAY BACKDROP ── */
.sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 49; }

/* ── EMPTY STATE ── */
.empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; color: var(--text-muted); padding: 2rem; text-align: center; }
.empty-state p { font-size: 14px; } .empty-state span { font-size: 12px; }

/* ── CLIENT HEADER ── */
.client-header { padding: 1rem 1.25rem; background: var(--white); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.9rem; flex-wrap: wrap; }
.avatar-lg { width: 44px; height: 44px; border-radius: 50%; background: var(--rose); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: white; flex-shrink: 0; }
.client-header h2 { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 500; }
.client-header p { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
.delete-btn { margin-left: auto; padding: 7px 13px; border: 1px solid var(--border); border-radius: var(--radius); background: transparent; color: var(--text-muted); font-size: 12px; font-family: 'DM Sans', sans-serif; cursor: pointer; white-space: nowrap; }
.delete-btn:hover { background: var(--rose-light); color: var(--rose); border-color: var(--rose-mid); }

/* ── TABS ── */
.tabs { display: flex; background: var(--white); border-bottom: 1px solid var(--border); padding: 0 1.25rem; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 0.8rem 0.9rem; font-size: 13px; cursor: pointer; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--rose); border-bottom-color: var(--rose); font-weight: 500; }
.tab-content { padding: 1.25rem; flex: 1; }

/* ── FORMS ── */
.section-label { font-size: 11px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0.75rem; margin-top: 1.5rem; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
.section-label:first-child { margin-top: 0; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-grid.three { grid-template-columns: 1fr 1fr 1fr; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 12px; color: var(--text-muted); line-height: 1.4; }
.field input, .field select, .field textarea { padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; background: var(--white); color: var(--text); font-family: 'DM Sans', sans-serif; outline: none; width: 100%; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--rose-mid); }
.field textarea { resize: vertical; min-height: 68px; }
.radio-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.radio-group label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; color: var(--text); }
.radio-group input[type=radio], .radio-group input[type=checkbox] { accent-color: var(--rose); width: 15px; height: 15px; }
.oui-non { display: flex; gap: 14px; margin-top: 4px; }
.oui-non label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.oui-non input { accent-color: var(--rose); width: 15px; height: 15px; }
.save-btn { margin-top: 1.1rem; padding: 10px 20px; background: var(--rose); color: white; border: none; border-radius: var(--radius); font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; display: flex; align-items: center; gap: 7px; }
.save-btn:hover { background: var(--rose-dark); }

/* ── PHOTOS ── */
.photos-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.photo-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.photo-thumb { width: 80px; height: 80px; border-radius: var(--radius); object-fit: cover; border: 1px solid var(--border); cursor: pointer; }
.photo-date { font-size: 10px; color: var(--text-muted); text-align: center; max-width: 80px; line-height: 1.3; }
.photo-rdv-label { font-size: 10px; color: var(--rose); text-align: center; max-width: 80px; line-height: 1.2; }
.photo-add { width: 80px; height: 80px; border-radius: var(--radius); border: 1.5px dashed var(--rose-mid); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--rose); font-size: 24px; flex-shrink: 0; }
.photo-add:hover { background: var(--rose-light); }

/* ── RDV ── */
.rdv-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; flex-wrap: wrap; gap: 8px; }
.add-rdv-btn { padding: 8px 14px; border: 1px solid var(--rose); border-radius: var(--radius); background: transparent; color: var(--rose); font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; }
.add-rdv-btn:hover { background: var(--rose-light); }
.rdv-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 10px; }
.rdv-toggle { padding: 0.85rem 1rem; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
.rdv-toggle:hover { background: var(--rose-pale); }
.rdv-toggle-left { display: flex; align-items: center; gap: 9px; }
.rdv-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rose-mid); flex-shrink: 0; }
.rdv-date-str { font-size: 14px; font-weight: 500; }
.rdv-prat { font-size: 12px; color: var(--text-muted); }
.rdv-body { display: none; padding: 1rem; border-top: 1px solid var(--border); }
.rdv-body.open { display: block; }
.mesures-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 1rem; }
.mesure-box { background: var(--rose-pale); border-radius: var(--radius); padding: 7px 9px; }
.mesure-lbl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; }
.mesure-val { font-size: 15px; font-weight: 300; }
.mesure-unit { font-size: 10px; color: var(--text-muted); }
.info-block { margin-bottom: 9px; }
.info-block-label { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.04em; }
.info-block-val { font-size: 13px; line-height: 1.5; }

/* ── NOTES ── */
.notes-wrap { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem; }
.notes-wrap textarea { width: 100%; border: none; background: transparent; resize: none; font-size: 13px; color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 150px; outline: none; line-height: 1.7; }

/* ── SUIVI TABLE ── */
.suivi-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 0.75rem; }
.suivi-table th { background: var(--rose-pale); padding: 7px 9px; text-align: left; font-size: 10px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; border: 1px solid var(--border); white-space: nowrap; }
.suivi-table td { padding: 7px 9px; border: 1px solid var(--border); }
.suivi-table tr:nth-child(even) td { background: var(--rose-pale); }

/* ── MODAL ── */
.overlay { position: fixed; inset: 0; background: rgba(42,31,35,0.45); display: flex; align-items: flex-end; justify-content: center; z-index: 200; }
@media (min-width: 640px) { .overlay { align-items: center; } }
.modal { background: var(--white); border-radius: var(--radius-lg) var(--radius-lg) 0 0; width: 100%; max-height: 92dvh; overflow-y: auto; }
@media (min-width: 640px) { .modal { border-radius: var(--radius-lg); width: 620px; max-width: 95vw; max-height: 88dvh; } }
.modal-head { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--white); z-index: 10; }
.modal-head h3 { font-family: 'Cormorant Garamond', serif; font-size: 19px; font-weight: 500; }
.modal-close { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 22px; line-height: 1; padding: 2px 6px; }
.modal-body { padding: 1.1rem 1.25rem; }
.modal-foot { padding: 0.9rem 1.25rem; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; position: sticky; bottom: 0; background: var(--white); }
.btn-cancel { padding: 8px 14px; background: transparent; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; color: var(--text-muted); }

/* ── TOAST ── */
.toast { position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%); background: var(--rose); color: white; padding: 10px 20px; border-radius: 20px; font-size: 13px; z-index: 999; white-space: nowrap; }

input[type="file"] { display: none; }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.88); display: flex; align-items: center; justify-content: center; z-index: 300; cursor: zoom-out; padding: 1rem; }
.lightbox img { max-width: 100%; max-height: 90dvh; border-radius: var(--radius); }

/* ── RESPONSIVE ── */
@media (max-width: 767px) {
  body { overflow: auto; }
  .app { flex-direction: column; height: auto; min-height: 100dvh; }
  .sidebar { position: fixed; top: 0; left: 0; height: 100dvh; transform: translateX(-100%); z-index: 50; width: 280px; min-width: 0; }
  .sidebar.open { transform: translateX(0); }
  .sidebar-backdrop.open { display: block; }
  .sidebar-close { display: block; }
  .mobile-topbar { display: flex; position: sticky; top: 0; z-index: 40; }
  .main { overflow-y: visible; }
  .client-header { padding: 0.85rem 1rem; }
  .delete-btn { padding: 6px 10px; font-size: 11px; }
  .tab-content { padding: 1rem; }
  .form-grid { grid-template-columns: 1fr; }
  .form-grid.three { grid-template-columns: 1fr; }
  .mesures-row { grid-template-columns: repeat(2, 1fr); }
  .tabs { padding: 0 0.75rem; }
  .tab { padding: 0.75rem 0.7rem; font-size: 12px; }
  .rdv-header-row { flex-direction: column; align-items: flex-start; }
  .suivi-table { font-size: 11px; }
  .suivi-table th, .suivi-table td { padding: 5px 7px; }
}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- Sidebar backdrop (mobile) -->
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div>
        <h1>✦ Bilan Minceur</h1>
        <p>Gestion des fiches clients</p>
      </div>
      <button class="sidebar-close" onclick="closeSidebar()">✕</button>
    </div>
    <div class="search-wrap">
      <input type="text" placeholder="Rechercher un client..." id="searchInput" oninput="filterClients()">
    </div>
    <div class="client-list" id="clientList">
      <p style="padding:1rem;font-size:12px;color:var(--text-muted)">Chargement...</p>
    </div>
    <button class="new-btn" onclick="openNewClientModal()">+ Nouveau client</button>
  </div>

  <!-- MAIN -->
  <div class="main" id="main">

    <!-- Mobile topbar -->
    <div class="mobile-topbar">
      <button class="hamburger" onclick="openSidebar()">☰</button>
      <h1>✦ Bilan Minceur</h1>
    </div>

    <div class="empty-state" id="emptyState">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#C2496A" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.25">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <p>Sélectionnez un client</p>
      <span>ou créez une nouvelle fiche</span>
    </div>

    <div id="clientView" style="display:none;flex-direction:column;flex:1;"></div>
  </div>
</div>

<div id="modalContainer"></div>
<input type="file" id="photoInput" accept="image/*" multiple onchange="handlePhotoUpload(event)">

<script>
const SUPABASE_URL = 'https://ltklzscktwddipmvplkx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_vsUUXQpJRitg6Pa-y47qXg_CaX-h0K8';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let clients = [], currentClient = null, currentTab = 'infos', currentRdvId = null, currentPhotoMode = 'client';

// ── SIDEBAR MOBILE ──
function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarBackdrop').classList.add('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('open');
}

// ── CLIENTS ──
async function loadClients() {
  const { data, error } = await sb.from('clients').select('*').order('nom');
  if (error) { console.error(error); return; }
  clients = data || [];
  renderClientList(clients);
}

function initials(nom, prenom) { return ((prenom||'?')[0] + (nom||'?')[0]).toUpperCase(); }

function renderClientList(list) {
  const el = document.getElementById('clientList');
  if (!list.length) { el.innerHTML = '<p style="padding:1rem;font-size:12px;color:var(--text-muted)">Aucun client trouvé</p>'; return; }
  el.innerHTML = list.map(c => `
    <div class="client-item ${currentClient?.id===c.id?'active':''}" onclick="selectClient('${c.id}')">
      <div class="avatar">${initials(c.nom,c.prenom)}</div>
      <div><div class="client-name">${c.prenom} ${c.nom}</div><div class="client-sub">${c.telephone||c.email||'—'}</div></div>
    </div>`).join('');
}

function filterClients() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  renderClientList(clients.filter(c => `${c.nom} ${c.prenom}`.toLowerCase().includes(q)));
}

async function selectClient(id) {
  currentClient = clients.find(c => c.id === id);
  renderClientList(clients);
  closeSidebar();
  document.getElementById('emptyState').style.display = 'none';
  const cv = document.getElementById('clientView');
  cv.style.display = 'flex';
  cv.innerHTML = `
    <div class="client-header">
      <div class="avatar-lg">${initials(currentClient.nom,currentClient.prenom)}</div>
      <div style="flex:1;min-width:0">
        <h2>${currentClient.prenom} ${currentClient.nom}</h2>
        <p>${[currentClient.telephone,currentClient.email].filter(Boolean).join(' · ')||'—'}</p>
      </div>
      <button class="delete-btn" onclick="confirmDeleteClient()">🗑 Supprimer</button>
    </div>
    <div class="tabs">
      <div class="tab ${currentTab==='infos'?'active':''}" onclick="switchTab('infos',this)">👤 Infos</div>
      <div class="tab ${currentTab==='besoins'?'active':''}" onclick="switchTab('besoins',this)">💬 Besoins</div>
      <div class="tab ${currentTab==='alim'?'active':''}" onclick="switchTab('alim',this)">🥗 Alimentation</div>
      <div class="tab ${currentTab==='sante'?'active':''}" onclick="switchTab('sante',this)">🩺 Santé</div>
      <div class="tab ${currentTab==='rdv'?'active':''}" onclick="switchTab('rdv',this)">📅 Rendez-vous</div>
      <div class="tab ${currentTab==='suivi'?'active':''}" onclick="switchTab('suivi',this)">📊 Suivi</div>
      <div class="tab ${currentTab==='notes'?'active':''}" onclick="switchTab('notes',this)">📝 Notes</div>
    </div>
    <div class="tab-content" id="tabContent"></div>`;
  renderTab();
}

function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderTab();
}

async function renderTab() {
  const c = document.getElementById('tabContent');
  if (!c) return;
  if (currentTab==='infos') renderInfos(c);
  else if (currentTab==='besoins') renderBesoins(c);
  else if (currentTab==='alim') renderAlim(c);
  else if (currentTab==='sante') renderSante(c);
  else if (currentTab==='rdv') await renderRdv(c);
  else if (currentTab==='suivi') await renderSuivi(c);
  else if (currentTab==='notes') renderNotes(c);
}

function v(id) { const el = document.getElementById(id); return el ? el.value : ''; }
function rb(name, val) { const el = document.querySelector(`input[name="${name}"][value="${val}"]`); if (el) el.checked = true; }
function grb(name) { const el = document.querySelector(`input[name="${name}"]:checked`); return el ? el.value : ''; }

// ── INFOS ──
function renderInfos(c) {
  const cl = currentClient;
  c.innerHTML = `
    <p class="section-label">Informations personnelles</p>
    <div class="form-grid">
      <div class="field"><label>Prénom</label><input id="f_prenom" value="${cl.prenom||''}"></div>
      <div class="field"><label>Nom</label><input id="f_nom" value="${cl.nom||''}"></div>
      <div class="field"><label>Date de naissance</label><input type="date" id="f_dob" value="${cl.date_naissance||''}"></div>
      <div class="field"><label>Téléphone</label><input id="f_tel" value="${cl.telephone||''}"></div>
      <div class="field full"><label>Email</label><input id="f_email" value="${cl.email||''}"></div>
      <div class="field full"><label>Adresse</label><input id="f_adresse" value="${cl.adresse||''}"></div>
      <div class="field"><label>Code postal</label><input id="f_cp" value="${cl.code_postal||''}"></div>
      <div class="field"><label>Ville</label><input id="f_ville" value="${cl.ville||''}"></div>
      <div class="field"><label>Profession</label><input id="f_profession" value="${cl.profession||''}"></div>
      <div class="field"><label>Situation familiale</label><input id="f_situation" value="${cl.situation_familiale||''}"></div>
      <div class="field"><label>Nombre d'enfants</label><input type="number" id="f_nb_enfants" value="${cl.nb_enfants||''}"></div>
      <div class="field"><label>Âge des enfants</label><input id="f_age_enfants" value="${cl.age_enfants||''}"></div>

// ── PHOTO CARD ──
function photoCard(p, mode, targetId) {
  const dateAjout = p.created_at ? new Date(p.created_at).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}) : '';
  const rdvDate = p.rendez_vous?.date_rdv ? new Date(p.rendez_vous.date_rdv+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}) : null;
  return `<div class="photo-item" id="pcard-${p.id}">
    <div style="position:relative;display:inline-block;">
      <img src="${p.url}" class="photo-thumb" alt="${p.titre||'Photo'}" onclick="openLightbox('${p.url}')">
      <button onclick="deletePhoto('${p.id}','${mode}','${targetId}')" title="Supprimer" style="position:absolute;top:3px;right:3px;background:rgba(0,0,0,0.55);color:white;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;line-height:1;">✕</button>
    </div>
    <span class="photo-date">${dateAjout}</span>
    ${mode==='all' ? `<span class="photo-rdv-label">${rdvDate ? 'Rdv '+rdvDate : 'Fiche client'}</span>` : ''}
    <input value="${p.titre||''}" placeholder="Titre..." onchange="updatePhotoMeta('${p.id}',this.value,null)" style="width:80px;font-size:11px;border:1px solid var(--border);border-radius:5px;padding:2px 5px;margin-top:2px;font-family:'DM Sans',sans-serif;color:var(--text);">
    <textarea placeholder="Commentaire..." onchange="updatePhotoMeta('${p.id}',null,this.value)" style="width:80px;font-size:11px;border:1px solid var(--border);border-radius:5px;padding:2px 5px;resize:none;height:40px;font-family:'DM Sans',sans-serif;color:var(--text);">${p.commentaire||''}</textarea>
  </div>`;
}

async function updatePhotoMeta(photoId, titre, commentaire) {
  const updates = {};
  if (titre !== null) updates.titre = titre;
  if (commentaire !== null) updates.commentaire = commentaire;
  await sb.from('photos').update(updates).eq('id', photoId);
  showToast('Sauvegardé ✓');
}

async function deletePhoto(photoId, mode, targetId) {
  if (!confirm('Supprimer cette photo ?')) return;
  const { error } = await sb.from('photos').delete().eq('id', photoId);
  if (!error) {
    document.getElementById('pcard-'+photoId)?.remove();
    if (mode === 'rdv') loadRdvPhotos(targetId);
    loadAllPhotos(currentClient.id);
    showToast('Photo supprimée ✓');
  } else alert('Erreur : ' + error.message);
}

// ── ALL PHOTOS ──
async function loadAllPhotos(clientId) {
  const { data } = await sb.from('photos').select('*, rendez_vous(date_rdv)').eq('client_id', clientId).order('created_at', {ascending: false});
  const grid = document.getElementById('photogrid-all-'+clientId);
  if (!grid) return;
  const photos = (data||[]).map(p => photoCard(p, 'all', clientId)).join('');
  grid.innerHTML = photos + `<div class="photo-add" onclick="triggerPhotoUpload('client','${clientId}')">+</div>`;
}

  const dateStr = r.date_rdv ? new Date(r.date_rdv+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'}) : '—';

  const ib = (label, val) => val ? `<div class="info-block"><div class="info-block-label">${label}</div><div class="info-block-val">${val}</div></div>` : '';
  return `<div class="rdv-card" id="rdvcard-${r.id}">
    <div class="rdv-toggle" onclick="toggleRdv('rdvb-${r.id}')">
      <div class="rdv-toggle-left">
        <div class="rdv-dot"></div>
        <div><div class="rdv-date-str">${dateStr}</div>${r.praticienne?`<div class="rdv-prat">${r.praticienne}</div>`:''}</div>
      </div>
      <span style="color:var(--text-muted);font-size:20px">›</span>
    </div>
    <div class="rdv-body" id="rdvb-${r.id}">

async function loadRdvPhotos(rdvId) {
  const { data } = await sb.from('photos').select('*').eq('rdv_id', rdvId).order('created_at', {ascending:false});
  const grid = document.getElementById('photogrid-'+rdvId);
  if (!grid) return;
  const photos = (data||[]).map(p => photoCard(p, 'rdv', rdvId)).join('');
  grid.innerHTML = photos + `<div class="photo-add" onclick="triggerPhotoUpload('rdv','${rdvId}')">+</div>`;
}

function toggleRdv(id) {
  const el = document.getElementById(id);
  const isOpen = el.classList.contains('open');
  document.querySelectorAll('.rdv-body').forEach(b => b.classList.remove('open'));
  if (!isOpen) { el.classList.add('open'); loadRdvPhotos(id.replace('rdvb-','')); }
}

function photoCard(p, mode, targetId) {
  const dateAjout = p.created_at ? new Date(p.created_at).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}) : '';
  const rdvDate = p.rendez_vous?.date_rdv ? new Date(p.rendez_vous.date_rdv+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}) : null;
  return `<div class="photo-item" id="pcard-${p.id}">
    <div style="position:relative;display:inline-block;">
      <img src="${p.url}" class="photo-thumb" alt="${p.titre||'Photo'}" onclick="openLightbox('${p.url}')">
      <button onclick="deletePhoto('${p.id}','${mode}','${targetId}')" style="position:absolute;top:3px;right:3px;background:rgba(0,0,0,0.55);color:white;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;">✕</button>
    </div>
    <span class="photo-date">${dateAjout}</span>
    ${rdvDate && mode==='all' ? `<span class="photo-rdv-label">Rdv ${rdvDate}</span>` : ''}
    ${mode==='all' && !p.rdv_id ? `<span class="photo-rdv-label">Fiche client</span>` : ''}
    <input value="${p.titre||''}" placeholder="Titre..." onchange="updatePhotoMeta('${p.id}',this.value,null)" style="width:80px;font-size:11px;border:1px solid var(--border);border-radius:5px;padding:2px 5px;margin-top:2px;font-family:'DM Sans',sans-serif;">
    <textarea placeholder="Commentaire..." onchange="updatePhotoMeta('${p.id}',null,this.value)" style="width:80px;font-size:11px;border:1px solid var(--border);border-radius:5px;padding:2px 5px;resize:none;height:40px;font-family:'DM Sans',sans-serif;">${p.commentaire||''}</textarea>
  </div>`;
}

async function updatePhotoMeta(photoId, titre, commentaire) {
  const updates = {};
  if (titre !== null) updates.titre = titre;
  if (commentaire !== null) updates.commentaire = commentaire;
  await sb.from('photos').update(updates).eq('id', photoId);
}

async function deletePhoto(photoId, mode, targetId) {
  if (!confirm('Supprimer cette photo ?')) return;
  const { error } = await sb.from('photos').delete().eq('id', photoId);
  if (!error) {
    document.getElementById('pcard-'+photoId)?.remove();
    if (currentTab === 'infos') loadAllPhotos(currentClient.id);
    showToast('Photo supprimée ✓');
  } else alert('Erreur : ' + error.message);
}

// ── PHOTO UPLOAD ──
function triggerPhotoUpload(mode, targetId) {
  currentPhotoMode = mode;
  currentRdvId = mode === 'rdv' ? targetId : null;
  document.getElementById('photoInput').dataset.targetId = targetId;
  document.getElementById('photoInput').dataset.mode = mode;
  document.getElementById('photoInput').click();
}

async function handlePhotoUpload(event) {
  const files = Array.from(event.target.files);
  const mode = event.target.dataset.mode || currentPhotoMode;
  const targetId = event.target.dataset.targetId;
  if (!files.length) return;
  for (const file of files) {
    const path = `${currentClient.id}/${mode==='rdv'?targetId:'general'}/${Date.now()}_${file.name}`;
    const { error: upErr } = await sb.storage.from('photos-clients').upload(path, file, {upsert:true});
    if (!upErr) {
      const { data: urlData } = sb.storage.from('photos-clients').getPublicUrl(path);
      await sb.from('photos').insert({
        client_id: currentClient.id,
        rdv_id: mode === 'rdv' ? targetId : null,
        url: urlData.publicUrl,
      });
    }
  }
  if (mode === 'rdv') loadRdvPhotos(targetId);
  if (currentTab === 'infos') loadAllPhotos(currentClient.id);
  event.target.value = '';
  showToast('Photos ajoutées ✓');
}

function openLightbox(url) {
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `<img src="${url}" alt="Photo client">`;
  lb.onclick = () => lb.remove();
  document.body.appendChild(lb);
}

async function renderSuivi(c) {
  const { data: rdvs } = await sb.from('rendez_vous').select('*').eq('client_id', currentClient.id).order('date_rdv', {ascending:true});
  const last4 = (rdvs||[]).slice(-4);
  const headers = last4.map(r => new Date(r.date_rdv+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'}));
  while (headers.length < 4) headers.push('—');
  const rows = [
    {label:'Poids (kg)', key:'poids'},
    {label:'Bras G (cm)', key:'bras_g'}, {label:'Bras D (cm)', key:'bras_d'},
    {label:'Taille (cm)', key:'tour_taille'}, {label:'Hanches (cm)', key:'tour_hanches'},
    {label:'Cuisse G (cm)', key:'tour_cuisses_g'}, {label:'Cuisse D (cm)', key:'tour_cuisses_d'},
    {label:'Mollet G (cm)', key:'tour_mollets_g'}, {label:'Mollet D (cm)', key:'tour_mollets_d'},
    {label:'IMC', key:'imc'}, {label:'Ressenti', key:'ressenti_client'},
  ];
  c.innerHTML = `
    <p class="section-label">Suivi des résultats</p>
    ${!last4.length ? '<p style="color:var(--text-muted);font-size:13px">Ajoutez des rendez-vous pour voir l\'évolution ici.</p>' : `
    <div style="overflow-x:auto">
      <table class="suivi-table">
        <thead><tr><th>Zone</th>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
        <tbody>${rows.map(row=>`
          <tr><td style="font-weight:500;white-space:nowrap">${row.label}</td>
          ${headers.map((_,i)=>`<td>${i<last4.length?(last4[i][row.key]||'—'):'—'}</td>`).join('')}</tr>`).join('')}
        </tbody>
      </table>
    </div>`}`;
}

function closeOverlay(e) { if (e.target.classList.contains('overlay')) closeModal(); }
function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

loadClients();
</script>
</body>
</html>
