<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilan Minceur — Gestion Clients</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --rose: #C2496A;
  --rose-light: #fdf0f3;
  --rose-mid: #f0c0cc;
  --rose-dark: #8a2f48;
  --rose-pale: #fdf7f8;
  --text: #2a1f23;
  --text-muted: #8a7a7e;
  --border: #e8dde0;
  --bg: #faf6f7;
  --white: #ffffff;
  --radius: 10px;
  --radius-lg: 14px;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
}

.app { display: flex; height: 100vh; }

/* SIDEBAR */
.sidebar {
  width: 270px;
  min-width: 270px;
  background: var(--white);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100vh;
}

.sidebar-logo {
  padding: 1.5rem 1.25rem 1rem;
  border-bottom: 1px solid var(--border);
}

.sidebar-logo h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 500;
  color: var(--rose);
  letter-spacing: 0.02em;
}

.sidebar-logo p {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.search-wrap {
  padding: 0.75rem 1rem;
  border-bottom: 1px solid var(--border);
}

.search-wrap input {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  background: var(--rose-pale);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  outline: none;
  transition: border-color 0.2s;
}

.search-wrap input:focus { border-color: var(--rose-mid); }
.search-wrap input::placeholder { color: var(--text-muted); }

.client-list { flex: 1; overflow-y: auto; padding: 0.5rem 0; }
.client-list::-webkit-scrollbar { width: 4px; }
.client-list::-webkit-scrollbar-thumb { background: var(--rose-mid); border-radius: 2px; }

.client-item {
  padding: 0.65rem 1.25rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  border-left: 3px solid transparent;
  transition: background 0.15s;
}

.client-item:hover { background: var(--rose-pale); }
.client-item.active { background: var(--rose-light); border-left-color: var(--rose); }

.avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--rose-mid);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 500;
  color: var(--rose-dark);
  flex-shrink: 0;
}

.client-item.active .avatar { background: var(--rose); color: white; }
.client-name { font-size: 13px; font-weight: 500; line-height: 1.3; }
.client-sub { font-size: 11px; color: var(--text-muted); }

.new-btn {
  margin: 0.75rem 1rem;
  padding: 9px;
  border: 1.5px dashed var(--rose-mid);
  border-radius: var(--radius);
  background: transparent;
  color: var(--rose);
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: background 0.15s;
}
.new-btn:hover { background: var(--rose-light); }

/* MAIN */
.main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
.main::-webkit-scrollbar { width: 4px; }
.main::-webkit-scrollbar-thumb { background: var(--rose-mid); border-radius: 2px; }

.empty-state {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1rem; color: var(--text-muted);
}

.empty-state svg { opacity: 0.25; }
.empty-state p { font-size: 14px; }
.empty-state span { font-size: 12px; }

.client-header {
  padding: 1.25rem 1.75rem;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 1rem;
}

.avatar-lg {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: var(--rose);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 500; color: white;
}

.client-header h2 { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 500; }
.client-header p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

/* TABS */
.tabs {
  display: flex;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 0 1.75rem;
}

.tab {
  padding: 0.85rem 1.1rem;
  font-size: 13px;
  cursor: pointer;
  color: var(--text-muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  display: flex; align-items: center; gap: 6px;
  transition: color 0.15s;
}

.tab:hover { color: var(--text); }
.tab.active { color: var(--rose); border-bottom-color: var(--rose); font-weight: 500; }

.tab-content { padding: 1.75rem; flex: 1; }

/* FORMS */
.section-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.07em;
  margin-bottom: 0.75rem;
  margin-top: 1.5rem;
}
.section-label:first-child { margin-top: 0; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-grid.three { grid-template-columns: 1fr 1fr 1fr; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 12px; color: var(--text-muted); }

.field input, .field select, .field textarea {
  padding: 8px 11px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  background: var(--white);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  outline: none;
  transition: border-color 0.2s;
}

.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--rose-mid); }
.field textarea { resize: vertical; min-height: 72px; }

.save-btn {
  margin-top: 1.25rem;
  padding: 10px 22px;
  background: var(--rose);
  color: white;
  border: none;
  border-radius: var(--radius);
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  display: flex; align-items: center; gap: 7px;
  transition: background 0.15s;
}
.save-btn:hover { background: var(--rose-dark); }

/* RDV */
.rdv-header-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1rem;
}

.add-rdv-btn {
  padding: 8px 16px;
  border: 1px solid var(--rose);
  border-radius: var(--radius);
  background: transparent;
  color: var(--rose);
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  transition: background 0.15s;
}
.add-rdv-btn:hover { background: var(--rose-light); }

.rdv-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 10px;
}

.rdv-toggle {
  padding: 0.9rem 1.1rem;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer;
  transition: background 0.15s;
}
.rdv-toggle:hover { background: var(--rose-pale); }

.rdv-toggle-left { display: flex; align-items: center; gap: 10px; }
.rdv-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rose-mid); }
.rdv-date-str { font-size: 14px; font-weight: 500; }
.rdv-prat { font-size: 12px; color: var(--text-muted); }

.rdv-body { display: none; padding: 1rem 1.1rem; border-top: 1px solid var(--border); }
.rdv-body.open { display: block; }

.mesures-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 1rem; }
.mesure-box { background: var(--rose-pale); border-radius: var(--radius); padding: 8px 10px; }
.mesure-lbl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
.mesure-val { font-size: 18px; font-weight: 300; color: var(--text); }
.mesure-unit { font-size: 11px; color: var(--text-muted); }

.info-block { margin-bottom: 10px; }
.info-block-label { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.04em; }
.info-block-val { font-size: 13px; color: var(--text); line-height: 1.5; }

.photos-section { margin-top: 0.75rem; }
.photos-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.photo-thumb { width: 76px; height: 76px; border-radius: var(--radius); object-fit: cover; border: 1px solid var(--border); cursor: pointer; }
.photo-add {
  width: 76px; height: 76px;
  border-radius: var(--radius);
  border: 1.5px dashed var(--rose-mid);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--rose); font-size: 22px;
  transition: background 0.15s;
}
.photo-add:hover { background: var(--rose-light); }

/* NOTES */
.notes-wrap {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.1rem;
}
.notes-wrap textarea {
  width: 100%; border: none; background: transparent;
  resize: none; font-size: 13px; color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 160px; outline: none; line-height: 1.7;
}

/* MODAL */
.overlay {
  position: fixed; inset: 0;
  background: rgba(42,31,35,0.4);
  display: flex; align-items: center; justify-content: center;
  z-index: 200;
  backdrop-filter: blur(2px);
}

.modal {
  background: var(--white);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  width: 560px; max-width: 95vw;
  max-height: 88vh; overflow-y: auto;
}

.modal-head {
  padding: 1.1rem 1.4rem;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.modal-head h3 { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 500; }
.modal-close { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 22px; line-height: 1; }
.modal-close:hover { color: var(--text); }

.modal-body { padding: 1.25rem 1.4rem; }
.modal-foot {
  padding: 1rem 1.4rem;
  border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px;
}

.btn-cancel {
  padding: 8px 16px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  color: var(--text-muted);
}
.btn-cancel:hover { background: var(--bg); }

/* TOAST */
.toast {
  position: fixed; bottom: 1.5rem; right: 1.5rem;
  background: var(--rose);
  color: white;
  padding: 10px 18px;
  border-radius: var(--radius);
  font-size: 13px;
  z-index: 999;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }

.empty-rdv { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 13px; }

input[type="file"] { display: none; }

/* Lightbox */
.lightbox {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.85);
  display: flex; align-items: center; justify-content: center;
  z-index: 300; cursor: zoom-out;
}
.lightbox img { max-width: 90vw; max-height: 90vh; border-radius: var(--radius); }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="sidebar">
    <div class="sidebar-logo">
      <h1>✦ Bilan Minceur</h1>
      <p>Gestion des fiches clients</p>
    </div>
    <div class="search-wrap">
      <input type="text" placeholder="Rechercher un client..." id="searchInput" oninput="filterClients()">
    </div>
    <div class="client-list" id="clientList">
      <p style="padding:1rem;font-size:12px;color:var(--text-muted)">Chargement...</p>
    </div>
    <button class="new-btn" onclick="openNewClientModal()">+ Nouveau client</button>
  </div>

  <div class="main" id="main">
    <div class="empty-state" id="emptyState">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#C2496A" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <p>Sélectionnez un client</p>
      <span>ou créez une nouvelle fiche</span>
    </div>
    <div id="clientView" style="display:none;flex-direction:column;flex:1;"></div>
  </div>
</div>

<div id="modalContainer"></div>
<input type="file" id="photoInput" accept="image/*" multiple onchange="handlePhotoUpload(event)">

<script>
const SUPABASE_URL = 'https://ltklzscktwddipmvplkx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_vsUUXQpJRitg6Pa-y47qXg_CaX-h0K8';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let clients = [];
let currentClient = null;
let currentTab = 'infos';
let currentRdvId = null;

async function loadClients() {
  const { data, error } = await sb.from('clients').select('*').order('nom');
  if (error) { console.error(error); return; }
  clients = data || [];
  renderClientList(clients);
}

function initials(nom, prenom) {
  return ((prenom||'?')[0] + (nom||'?')[0]).toUpperCase();
}

function renderClientList(list) {
  const el = document.getElementById('clientList');
  if (!list.length) {
    el.innerHTML = '<p style="padding:1rem;font-size:12px;color:var(--text-muted)">Aucun client trouvé</p>';
    return;
  }
  el.innerHTML = list.map(c => `
    <div class="client-item ${currentClient?.id===c.id?'active':''}" onclick="selectClient('${c.id}')">
      <div class="avatar">${initials(c.nom,c.prenom)}</div>
      <div>
        <div class="client-name">${c.prenom} ${c.nom}</div>
        <div class="client-sub">${c.telephone||c.email||'—'}</div>
      </div>
    </div>`).join('');
}

function filterClients() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  renderClientList(clients.filter(c => `${c.nom} ${c.prenom}`.toLowerCase().includes(q)));
}

async function selectClient(id) {
  currentClient = clients.find(c => c.id === id);
  renderClientList(clients);
  document.getElementById('emptyState').style.display = 'none';
  const cv = document.getElementById('clientView');
  cv.style.display = 'flex';
  cv.innerHTML = `
    <div class="client-header">
      <div class="avatar-lg">${initials(currentClient.nom,currentClient.prenom)}</div>
      <div>
        <h2>${currentClient.prenom} ${currentClient.nom}</h2>
        <p>${[currentClient.telephone,currentClient.email].filter(Boolean).join(' · ')||'—'}</p>
      </div>
    </div>
    <div class="tabs">
      <div class="tab ${currentTab==='infos'?'active':''}" onclick="switchTab('infos',this)">👤 Infos</div>
      <div class="tab ${currentTab==='rdv'?'active':''}" onclick="switchTab('rdv',this)">📅 Rendez-vous</div>
      <div class="tab ${currentTab==='notes'?'active':''}" onclick="switchTab('notes',this)">📝 Notes</div>
    </div>
    <div class="tab-content" id="tabContent"></div>`;
  renderTab();
}

function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderTab();
}

async function renderTab() {
  const c = document.getElementById('tabContent');
  if (!c) return;
  if (currentTab === 'infos') renderInfos(c);
  else if (currentTab === 'rdv') await renderRdv(c);
  else if (currentTab === 'notes') renderNotes(c);
}

function renderInfos(c) {
  const cl = currentClient;
  c.innerHTML = `
    <p class="section-label">Informations personnelles</p>
    <div class="form-grid">
      <div class="field"><label>Prénom</label><input id="f_prenom" value="${cl.prenom||''}"></div>
      <div class="field"><label>Nom</label><input id="f_nom" value="${cl.nom||''}"></div>
      <div class="field"><label>Date de naissance</label><input type="date" id="f_dob" value="${cl.date_naissance||''}"></div>
      <div class="field"><label>Téléphone</label><input id="f_tel" value="${cl.telephone||''}"></div>
      <div class="field full"><label>Email</label><input id="f_email" value="${cl.email||''}"></div>
    </div>
    <p class="section-label" style="margin-top:1.5rem">Bilan initial</p>
    <div class="form-grid">
      <div class="field full"><label>Objectif minceur</label><textarea id="f_objectif">${cl.objectif||''}</textarea></div>
      <div class="field full"><label>Antécédents / contre-indications</label><textarea id="f_antecedents">${cl.antecedents||''}</textarea></div>
      <div class="field full"><label>Traitements médicaux en cours</label><textarea id="f_traitements">${cl.traitements_medicaux||''}</textarea></div>
    </div>
    <button class="save-btn" onclick="saveClient()">💾 Enregistrer</button>`;
}

async function saveClient() {
  const updates = {
    prenom: document.getElementById('f_prenom').value,
    nom: document.getElementById('f_nom').value,
    date_naissance: document.getElementById('f_dob').value||null,
    telephone: document.getElementById('f_tel').value,
    email: document.getElementById('f_email').value,
    objectif: document.getElementById('f_objectif').value,
    antecedents: document.getElementById('f_antecedents').value,
    traitements_medicaux: document.getElementById('f_traitements').value,
  };
  const { error } = await sb.from('clients').update(updates).eq('id', currentClient.id);
  if (!error) {
    Object.assign(currentClient, updates);
    await loadClients();
    showToast('Fiche enregistrée ✓');
  } else { alert('Erreur : ' + error.message); }
}

async function renderRdv(c) {
  const { data: rdvs } = await sb.from('rendez_vous').select('*').eq('client_id', currentClient.id).order('date_rdv', {ascending:false});
  c.innerHTML = `
    <div class="rdv-header-row">
      <p class="section-label" style="margin:0">Historique des rendez-vous</p>
      <button class="add-rdv-btn" onclick="openNewRdvModal()">+ Nouveau rdv</button>
    </div>
    <div id="rdvList">
      ${!rdvs?.length
        ? '<div class="empty-rdv">Aucun rendez-vous enregistré pour ce client.</div>'
        : rdvs.map(r => rdvCard(r)).join('')}
    </div>`;
}

function rdvCard(r) {
  const dateStr = r.date_rdv
    ? new Date(r.date_rdv+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'})
    : '—';
  return `<div class="rdv-card">
    <div class="rdv-toggle" onclick="toggleRdv('rdvb-${r.id}')">
      <div class="rdv-toggle-left">
        <div class="rdv-dot"></div>
        <div>
          <div class="rdv-date-str">${dateStr}</div>
          ${r.praticienne?`<div class="rdv-prat">${r.praticienne}</div>`:''}
        </div>
      </div>
      <span style="color:var(--text-muted);font-size:18px">›</span>
    </div>
    <div class="rdv-body" id="rdvb-${r.id}">
      <div class="mesures-row">
        <div class="mesure-box"><div class="mesure-lbl">Poids</div><div class="mesure-val">${r.poids||'—'}<span class="mesure-unit"> kg</span></div></div>
        <div class="mesure-box"><div class="mesure-lbl">Taille</div><div class="mesure-val">${r.tour_taille||'—'}<span class="mesure-unit"> cm</span></div></div>
        <div class="mesure-box"><div class="mesure-lbl">Hanches</div><div class="mesure-val">${r.tour_hanches||'—'}<span class="mesure-unit"> cm</span></div></div>
        <div class="mesure-box"><div class="mesure-lbl">Cuisses G/D</div><div class="mesure-val">${r.tour_cuisses_g||'—'}/${r.tour_cuisses_d||'—'}<span class="mesure-unit"> cm</span></div></div>
      </div>
      ${r.soins_effectues?`<div class="info-block"><div class="info-block-label">Soins effectués</div><div class="info-block-val">${r.soins_effectues}</div></div>`:''}
      ${r.soins_preconises?`<div class="info-block"><div class="info-block-label">Soins préconisés</div><div class="info-block-val">${r.soins_preconises}</div></div>`:''}
      ${r.observations?`<div class="info-block"><div class="info-block-label">Observations</div><div class="info-block-val">${r.observations}</div></div>`:''}
      <div class="photos-section">
        <div class="info-block-label">Photos</div>
        <div class="photos-grid" id="photogrid-${r.id}">
          <div class="photo-add" onclick="triggerPhotoUpload('${r.id}')">+</div>
        </div>
      </div>
    </div>
  </div>`;
}

async function loadPhotos(rdvId) {
  const { data } = await sb.from('photos').select('*').eq('rdv_id', rdvId);
  const grid = document.getElementById('photogrid-'+rdvId);
  if (!grid) return;
  const existing = (data||[]).map(p => `<img src="${p.url}" class="photo-thumb" alt="Photo" onclick="openLightbox('${p.url}')">`).join('');
  grid.innerHTML = existing + `<div class="photo-add" onclick="triggerPhotoUpload('${rdvId}')">+</div>`;
}

function toggleRdv(id) {
  const el = document.getElementById(id);
  const isOpen = el.classList.contains('open');
  document.querySelectorAll('.rdv-body').forEach(b => b.classList.remove('open'));
  if (!isOpen) {
    el.classList.add('open');
    loadPhotos(id.replace('rdvb-',''));
  }
}

function triggerPhotoUpload(rdvId) {
  currentRdvId = rdvId;
  document.getElementById('photoInput').click();
}

async function handlePhotoUpload(event) {
  const files = Array.from(event.target.files);
  for (const file of files) {
    const path = `${currentClient.id}/${currentRdvId}/${Date.now()}_${file.name}`;
    const { error } = await sb.storage.from('photos-clients').upload(path, file, {upsert:true});
    if (!error) {
      const { data: urlData } = sb.storage.from('photos-clients').getPublicUrl(path);
      await sb.from('photos').insert({ client_id: currentClient.id, rdv_id: currentRdvId, url: urlData.publicUrl });
    }
  }
  loadPhotos(currentRdvId);
  event.target.value = '';
  showToast('Photos ajoutées ✓');
}

function openLightbox(url) {
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `<img src="${url}" alt="Photo client">`;
  lb.onclick = () => lb.remove();
  document.body.appendChild(lb);
}

function renderNotes(c) {
  c.innerHTML = `
    <p class="section-label">Notes libres</p>
    <div class="notes-wrap">
      <textarea id="f_notes" placeholder="Notes diverses, habitudes alimentaires, ressenti client, observations entre les séances...">${currentClient.notes_initiales||''}</textarea>
    </div>
    <button class="save-btn" onclick="saveNotes()">💾 Enregistrer</button>`;
}

async function saveNotes() {
  const notes = document.getElementById('f_notes').value;
  const { error } = await sb.from('clients').update({notes_initiales: notes}).eq('id', currentClient.id);
  if (!error) { currentClient.notes_initiales = notes; showToast('Notes enregistrées ✓'); }
}

function openNewClientModal() {
  document.getElementById('modalContainer').innerHTML = `

      <div class="modal">
        <div class="modal-head">
          <h3>Nouveau client</h3>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
          <div class="form-grid">
            <div class="field"><label>Prénom *</label><input id="nc_prenom" placeholder="Marie"></div>
            <div class="field"><label>Nom *</label><input id="nc_nom" placeholder="Dupont"></div>
            <div class="field"><label>Téléphone</label><input id="nc_tel" placeholder="06 12 34 56 78"></div>
            <div class="field"><label>Email</label><input id="nc_email" placeholder="marie@email.fr"></div>

          </div>
        </div>

async function createClient() {
  const prenom = document.getElementById('nc_prenom').value.trim();
  const nom = document.getElementById('nc_nom').value.trim();
  if (!prenom || !nom) { alert('Prénom et nom sont obligatoires'); return; }
  const { data, error } = await sb.from('clients').insert({
    prenom, nom,
    telephone: document.getElementById('nc_tel').value,
    email: document.getElementById('nc_email').value,
    date_naissance: document.getElementById('nc_dob').value||null
  }).select().single();
  if (!error) {
    closeModal();
    await loadClients();
    selectClient(data.id);
    showToast('Fiche créée ✓');
  } else { alert('Erreur : ' + error.message); }
}

async function createRdv() {
  const date = document.getElementById('nr_date').value;
  if (!date) { alert('La date est obligatoire'); return; }
  const { error } = await sb.from('rendez_vous').insert({
    client_id: currentClient.id,
    date_rdv: date,
    praticienne: document.getElementById('nr_prat').value,
    poids: document.getElementById('nr_poids').value||null,
    tour_taille: document.getElementById('nr_taille').value||null,
    tour_hanches: document.getElementById('nr_hanches').value||null,
    tour_cuisses_g: document.getElementById('nr_cg').value||null,
    tour_cuisses_d: document.getElementById('nr_cd').value||null,
    tour_bras_g: document.getElementById('nr_bg').value||null,
    soins_effectues: document.getElementById('nr_soins_eff').value,
    soins_preconises: document.getElementById('nr_soins_preco').value,
    observations: document.getElementById('nr_obs').value,
  });
  if (!error) {
    closeModal();
    await renderTab();
    showToast('Rendez-vous enregistré ✓');
  } else { alert('Erreur : ' + error.message); }
}

function closeOverlay(e) { if (e.target.classList.contains('overlay')) closeModal(); }
function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

loadClients();
</script>
